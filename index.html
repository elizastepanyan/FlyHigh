
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyHigh Agency</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ========== GLOBAL ========== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

    body { background:#eef6ff; color:#2d2d2d; line-height:1.6; }

    .container { width:90%; max-width:1100px; margin:auto; }

    section { padding:80px 0; }

    h1,h2,h3 { font-weight:600; }
    p { color:#555; }

    /* ========== NAVBAR ========== */
    .navbar {
      display:flex; justify-content:space-between; align-items:center;
      padding:20px 0;
    }

    .logo { font-weight:600; font-size:20px; color:#9f8cff; }

    .nav-links a {
      margin-left:20px; text-decoration:none; color:#444; font-size:14px;
      transition:0.3s;
    }

    .nav-links a:hover { color:#9f8cff; }

    /* ========== BUTTON ========== */
    .btn {
      display:inline-block; padding:12px 24px;
      background:#b8a8ff; color:#fff; border-radius:999px;
      transition:0.3s;
    }

    .btn:hover {
      background:#9f8cff; transform:translateY(-2px);
      box-shadow:0 8px 20px rgba(159,140,255,0.4);
    }

    /* ========== HERO ========== */
    .hero { text-align:center; }

    .hero h1 { font-size:3rem; margin-bottom:10px; }
    .hero span { color:#9f8cff; }

    .hero p { margin-bottom:25px; }

    /* Search Box UI */
    .search-box {
      background:#fff;
      padding:15px;
      border-radius:20px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.05);
      margin-bottom:30px;
    }

    .search-box input {
      padding:10px;
      border:none;
      background:#f3f4ff;
      border-radius:10px;
      min-width:120px;
    }

    .hero img {
      width:100%; max-width:500px;
      border-radius:20px;
      margin-top:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    /* ========== ABOUT ========== */
    .about { text-align:center; max-width:700px; margin:auto; }
